  tasks_transport_http.PatchTaskRequest:
    properties:
      completed:
        example: "false"
        type: string
      description:
        example: Walk a dog at 6:30 am
        type: string
      title:
        example: Walk a dog
        type: string
    type: object
  tasks_transport_http.PatchTaskResponse:
    properties:
      author_user_id:
        example: 5
        type: integer
      completed:
        example: false
        type: boolean
      completed_at:
        example: "null"
        type: string
      created_at:
        example: "2026-06-05T16:15:00Z"
        type: string
      description:
        example: Do a math homework until Wednesday
